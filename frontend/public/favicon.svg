<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Link Extractor logo, "Bolt Tray": a bolt dropping into a download tray, on a glass tile.
    This is the default Cyber-Dark coloring. generate-icons.mjs turns it into the favicon,
    the PNG icons and app_icon.ico. src/components/BrandLogo.svelte draws the same shapes
    in the theme's colors for the sidebar and the splash, so change both together.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2738"/>
      <stop offset="1" stop-color="#060a11"/>
    </linearGradient>
    <radialGradient id="tint" cx="0.28" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="170" y1="60" x2="350" y2="455">
      <stop offset="0" stop-color="#5ff7c4"/>
      <stop offset="0.45" stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <g id="mark-shapes">
      <path d="M 301.13 73.65 Q 304 62 297.68 72.20 L 186.32 251.80 Q 180 262 192.00 262.00 L 246.00 262.00 Q 258 262 255.21 273.67 L 228.79 384.33 Q 226 396 232.23 385.75 L 343.77 202.25 Q 350 192 338.00 192.00 L 284.00 192.00 Q 272 192 274.87 180.35 Z" stroke="none"/>
      <path d="M 128 350 L 128 398 Q 128 434 164 434 L 348 434 Q 384 434 384 398 L 384 350" fill="none" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tile)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tint)"/>
  <use href="#mark-shapes" xlink:href="#mark-shapes" fill="#10b981" stroke="#10b981" opacity="0.55" filter="url(#glow)"/>
  <use href="#mark-shapes" xlink:href="#mark-shapes" fill="url(#mark)" stroke="url(#mark)"/>
  <use href="#mark-shapes" xlink:href="#mark-shapes" fill="url(#shine)" stroke="url(#shine)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
